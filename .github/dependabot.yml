version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      # org.jahia.* (incl. the jahia-modules parent) defines the target Jahia version
      - dependency-name: "org.jahia.*"
